<!DOCTYPE html>
<html lang="ko" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Theme Initialization -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <!-- Hide i18n elements until translations load - optimized to prevent CLS -->
    <style>
        html.i18n-loading [data-i18n],
        html.i18n-loading [data-i18n-placeholder],
        html.i18n-loading [data-i18n-title] {
            visibility: hidden;
            min-height: 1.5em; /* Reserve space to prevent layout shift */
        }

        html:not(.i18n-loading) [data-i18n],
        html:not(.i18n-loading) [data-i18n-placeholder],
        html:not(.i18n-loading) [data-i18n-title] {
            visibility: visible;
            transition: opacity 0.15s ease-in;
        }
    </style>
    <script>document.documentElement.classList.add('i18n-loading');</script>

    <title>레코드 도감</title>
    <link rel="icon" type="image/png" href="assets/others/favicon.png">

    <!-- DNS Prefetch & Preconnect - Performance optimized -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://static.cloudflareinsights.com">

    <!-- Font Awesome 7 Icons - Optimized loading -->
    <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous" referrerpolicy="no-referrer">
    </noscript>

    <link rel="stylesheet" href="css/utils.css">
    <link rel="stylesheet" href="css/components/ui-components.css">
    <link rel="stylesheet" href="css/discdb.css">

    <script defer src='https://static.cloudflareinsights.com/beacon.min.js'
        data-cf-beacon='{"token": "2db4a0ab2bf144419ec4ed1c864c934d"}'></script>
</head>

<body>
    <!-- Navigation Bar (Dynamic) -->
    <div id="global-navigation"></div>

    <div class="container">
        <header>
            <h1><img src="assets/others/btn_main_system_outfit_1.png" alt="Disc DB Icon" class="page-title-icon"> <span data-i18n="discdb.pageTitle"></span></h1>
            <p class="subtitle" data-i18n="discdb.subtitle"></p>
        </header>

        <!-- Disc Selection Section -->
        <div class="disc-select-section">
            <h2 class="section-title">
                <span class="section-icon"><i class="fa-solid fa-compact-disc"></i></span>
                <span data-i18n="discdb.selectDisc"></span>
            </h2>

            <div class="selector-controls">
                <div class="search-container">
                    <input type="text" id="disc-search" data-i18n-placeholder="discdb.searchPlaceholder"
                        class="search-input">
                    <i class="fa-solid fa-search search-icon"></i>
                </div>

                <div class="element-filters">
                    <button class="element-filter-btn active" data-element="all"
                        onclick="window.filterDiscsByElement('all')">
                        <i class="fa-solid fa-border-all"></i> <span data-i18n="discdb.all"></span>
                    </button>
                    <button class="element-filter-btn" data-element="1" onclick="window.filterDiscsByElement('1')">
                        <img src="assets/icon_common_property_1.png" alt="물 속성" class="element-icon"
                            onerror="this.style.display='none'"> <span data-i18n="discdb.water"></span>
                    </button>
                    <button class="element-filter-btn" data-element="2" onclick="window.filterDiscsByElement('2')">
                        <img src="assets/icon_common_property_2.png" alt="불 속성" class="element-icon"
                            onerror="this.style.display='none'"> <span data-i18n="discdb.fire"></span>
                    </button>
                    <button class="element-filter-btn" data-element="3" onclick="window.filterDiscsByElement('3')">
                        <img src="assets/icon_common_property_3.png" alt="땅 속성" class="element-icon"
                            onerror="this.style.display='none'"> <span data-i18n="discdb.earth"></span>
                    </button>
                    <button class="element-filter-btn" data-element="4" onclick="window.filterDiscsByElement('4')">
                        <img src="assets/icon_common_property_4.png" alt="바람 속성" class="element-icon"
                            onerror="this.style.display='none'"> <span data-i18n="discdb.wind"></span>
                    </button>
                    <button class="element-filter-btn" data-element="5" onclick="window.filterDiscsByElement('5')">
                        <img src="assets/icon_common_property_5.png" alt="빛 속성" class="element-icon"
                            onerror="this.style.display='none'"> <span data-i18n="discdb.light"></span>
                    </button>
                    <button class="element-filter-btn" data-element="6" onclick="window.filterDiscsByElement('6')">
                        <img src="assets/icon_common_property_6.png" alt="어둠 속성" class="element-icon"
                            onerror="this.style.display='none'"> <span data-i18n="discdb.dark"></span>
                    </button>
                    <button class="element-filter-btn" data-element="7" onclick="window.filterDiscsByElement('7')">
                        <img src="assets/icon_common_property_7.png" alt="무속성" class="element-icon"
                            onerror="this.style.display='none'"> <span data-i18n="discdb.none"></span>
                    </button>
                </div>
            </div>

            <div id="disc-selector" class="disc-selector-scroll"></div>
        </div>

        <!-- Disc Details Section -->
        <div id="disc-details" class="disc-details-container" style="display: none;">
            <div class="disc-hero-section">
                <div class="disc-portrait-hero">
                    <div class="portrait-background"></div>
                    <div id="disc-image-container" class="disc-image-wrapper">
                        <img id="disc-portrait" src="" alt="Disc Image">
                    </div>
                </div>

                <div class="disc-info-hero">
                    <div class="disc-name-section">
                        <div class="disc-name-row">
                            <h2 id="disc-name" class="disc-name-hero">-</h2>
                            <img id="disc-element-icon" class="disc-element-icon-inline" src="" alt=""
                                onerror="this.style.display='none'">
                        </div>
                        <div class="disc-id-row">
                            <span id="disc-id" class="disc-id-badge">-</span>
                            <span id="disc-rarity-stars" class="disc-rarity-stars"></span>
                        </div>
                        <div id="disc-tags" class="disc-tags-row"></div>
                    </div>
                    <div class="disc-details-card">
                        <div id="disc-description" class="disc-description"></div>
                    </div>
                </div>
            </div>

            <div class="disc-attributes-section">
                <div class="section-header">
                    <h2 class="section-title">
                        <span class="section-icon"><i class="fa-solid fa-chart-line"></i></span>
                        <span data-i18n="discdb.discAttributes"></span>
                    </h2>
                </div>
                <div class="disc-level-control">
                    <label for="disc-level-slider" class="level-label">
                        <span data-i18n="discdb.level"></span>: <span id="disc-current-level"
                            class="level-display">1</span>
                        <span id="disc-limitbreak-badge" class="limitbreak-badge" style="display: none;"><span
                                data-i18n="discdb.limitBreak"></span> <span id="disc-current-limitbreak">0</span></span>
                    </label>
                    <input type="range" id="disc-level-slider" class="level-slider" min="1" max="98" value="1"
                        oninput="window.adjustDiscLevelSlider()">
                </div>
                <div id="disc-stats-grid" class="disc-stats-grid"></div>
            </div>

            <div class="skills-section">
                <div class="section-header">
                    <h2 class="section-title">
                        <span class="section-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
                        <span data-i18n="discdb.skillInfo"></span>
                    </h2>
                </div>
                <div class="skill-level-control">
                    <label class="level-label">
                        <i class="fa-solid fa-star"></i> <span data-i18n="discdb.skillLevel"></span>
                    </label>
                    <div class="level-adjuster">
                        <button class="level-btn" onclick="window.adjustSkillLevel(-1)">
                            <i class="fa-solid fa-minus"></i>
                        </button>
                        <span id="skill-level-display" class="level-display">5</span>
                        <button class="level-btn" onclick="window.adjustSkillLevel(1)">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </div>
                <div id="skills-container" class="skills-container"></div>
            </div>

            <div class="archive-section">
                <div class="section-header">
                    <h2 class="section-title">
                        <span class="section-icon"><i class="fa-solid fa-book-bookmark"></i></span>
                        <span data-i18n="discdb.discStory"></span>
                    </h2>
                </div>
                <div id="archive-container" class="archive-container"></div>
            </div>
        </div>
    </div>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swUrl = new URL('sw.js', window.location.href).pathname;
                navigator.serviceWorker.register(swUrl)
                    .then(reg => console.log('[SW] Registered:', reg.scope))
                    .catch(err => console.warn('[SW] Registration failed:', err));
            });
        }
    </script>

    <script type="module" src="src/pages/discdb.ts"></script>
</body>

</html>
