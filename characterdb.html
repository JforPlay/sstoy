<!DOCTYPE html>
<html lang="ko" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Theme Initialization -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <!-- Hide i18n elements until translations load - optimized to prevent CLS -->
    <style>
        html.i18n-loading [data-i18n],
        html.i18n-loading [data-i18n-placeholder],
        html.i18n-loading [data-i18n-title] {
            visibility: hidden;
            min-height: 1.5em; /* Reserve space to prevent layout shift */
        }

        html:not(.i18n-loading) [data-i18n],
        html:not(.i18n-loading) [data-i18n-placeholder],
        html:not(.i18n-loading) [data-i18n-title] {
            visibility: visible;
            transition: opacity 0.15s ease-in;
        }
    </style>
    <script>document.documentElement.classList.add('i18n-loading');</script>

    <title>여행가 DB</title>
    <link rel="icon" type="image/png" href="assets/others/favicon.png">

    <!-- DNS Prefetch & Preconnect - Performance optimized -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://static.cloudflareinsights.com">

    <!-- Font Awesome 7 Icons - Optimized loading -->
    <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous" referrerpolicy="no-referrer">
    </noscript>

    <link rel="stylesheet" href="css/utils.css">
    <link rel="stylesheet" href="css/components/ui-components.css">
    <link rel="stylesheet" href="css/components/audio-player.css">
    <link rel="stylesheet" href="css/characterdb.css">

    <script defer src='https://static.cloudflareinsights.com/beacon.min.js'
        data-cf-beacon='{"token": "2db4a0ab2bf144419ec4ed1c864c934d"}'></script>
</head>

<body>
    <!-- Navigation Bar (Dynamic) -->
    <div id="global-navigation"></div>

    <div class="container">
        <header>
            <div class="header-title-row">
                <h1><img src="assets/others/btn_main_system_character_1.png" alt="Character DB Icon" class="page-title-icon"> <span data-i18n="characterdb.title"></span></h1>
                <button class="page-info-btn" data-action="open-info-modal" title="페이지 도움말">
                    <i class="fa-solid fa-circle-question"></i>
                </button>
            </div>
            <p class="subtitle" data-i18n="characterdb.selectCharacter"></p>
        </header>

        <!-- Page Info Modal -->
        <div id="page-info-modal" class="info-modal">
            <div class="info-modal-content">
                <div class="info-modal-header">
                    <h2><i class="fa-solid fa-circle-question"></i> <span data-i18n="common.howToUse">사용 방법</span></h2>
                    <button class="info-modal-close" data-action="close-info-modal">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="info-modal-body" data-i18n-html="characterdb.instructions">
                </div>
            </div>
        </div>

        <!-- Character Selection Section -->
        <div class="character-select-section">
            <h2 class="section-title">
                <span class="section-icon"><i class="fa-solid fa-users"></i></span>
                <span data-i18n="characterdb.characterSelect"></span>
            </h2>
            
            <div class="selector-controls" style="background: transparent; border: none; padding: 0 0 1rem 0; box-shadow: none;">
                <div class="element-filters" style="justify-content: center;">
                    <button class="element-filter-btn active" data-element="all" onclick="window.filterCharactersByElement('all', event)">
                        <i class="fa-solid fa-border-all"></i> <span data-i18n="disc.allElements">All</span>
                    </button>
                    <button class="element-filter-btn" data-element="1" onclick="window.filterCharactersByElement('1', event)">
                        <img src="assets/icon_common_property_1.png" alt="Water" class="element-icon" onerror="this.style.display='none'"> <span data-i18n="disc.waterElement">Water</span>
                    </button>
                    <button class="element-filter-btn" data-element="2" onclick="window.filterCharactersByElement('2', event)">
                        <img src="assets/icon_common_property_2.png" alt="Fire" class="element-icon" onerror="this.style.display='none'"> <span data-i18n="disc.fireElement">Fire</span>
                    </button>
                    <button class="element-filter-btn" data-element="3" onclick="window.filterCharactersByElement('3', event)">
                        <img src="assets/icon_common_property_3.png" alt="Earth" class="element-icon" onerror="this.style.display='none'"> <span data-i18n="disc.earthElement">Earth</span>
                    </button>
                    <button class="element-filter-btn" data-element="4" onclick="window.filterCharactersByElement('4', event)">
                        <img src="assets/icon_common_property_4.png" alt="Wind" class="element-icon" onerror="this.style.display='none'"> <span data-i18n="disc.windElement">Wind</span>
                    </button>
                    <button class="element-filter-btn" data-element="5" onclick="window.filterCharactersByElement('5', event)">
                        <img src="assets/icon_common_property_5.png" alt="Light" class="element-icon" onerror="this.style.display='none'"> <span data-i18n="disc.lightElement">Light</span>
                    </button>
                    <button class="element-filter-btn" data-element="6" onclick="window.filterCharactersByElement('6', event)">
                        <img src="assets/icon_common_property_6.png" alt="Dark" class="element-icon" onerror="this.style.display='none'"> <span data-i18n="disc.darkElement">Dark</span>
                    </button>
                </div>
            </div>

            <div id="character-selector" class="character-selector-grid"></div>
        </div>

        <!-- Character Details Section -->
        <div id="character-details" class="character-details-container" style="display: none;">
            <div class="character-info-dating-row">
                <div class="character-hero-section">
                    <div class="character-portrait-hero">
                        <div class="portrait-background"></div>
                        <img id="char-portrait" src="" alt="Character Portrait" style="display:none;">
                        <div class="char-type-selector-hero">
                            <button class="char-type-btn active" onclick="window.changeCharacterType('01', event)"
                                data-i18n="characterdb.characterType.normal"></button>
                            <button class="char-type-btn" onclick="window.changeCharacterType('02', event)"
                                data-i18n="characterdb.characterType.awakened"></button>
                            <button class="char-type-btn" onclick="window.changeCharacterType('03', event)"
                                data-i18n="characterdb.characterType.skin"></button>
                        </div>
                    </div>

                    <div class="character-info-hero">
                        <div class="char-name-section">
                            <div class="char-name-row">
                                <h2 id="char-name" class="character-name-hero">-</h2>
                                <img id="char-element-icon" class="char-element-icon-inline" src="" alt=""
                                    onerror="this.style.display='none'">
                                <span id="char-grade" class="grade-badge-inline">-</span>
                            </div>
                        </div>
                        <div class="char-details-card">
                            <div id="char-tags" class="character-tags-hero"></div>
                            <div id="char-additional-info" class="character-additional-info-hero"></div>
                        </div>
                        <div id="char-quick-stats" class="char-quick-stats"></div>
                    </div>
                </div>

                <div class="dating-section">
                    <div class="section-header">
                        <h2 class="section-title">
                            <span class="section-icon"><i class="fa-solid fa-heart"></i></span>
                            <span data-i18n="characterdb.dating"></span>
                        </h2>
                    </div>
                    <div id="dating-list" class="dating-list"></div>
                </div>
            </div>

            <!-- Tab Navigation -->
            <div class="chardb-tabs">
                <button class="chardb-tab-btn active" onclick="window.switchCharDbTab('images')">
                    <i class="fa-solid fa-images"></i>
                    <span data-i18n="characterdb.images"></span>
                </button>
                <button class="chardb-tab-btn" onclick="window.switchCharDbTab('archive-stats')">
                    <i class="fa-solid fa-book-bookmark"></i>
                    <span data-i18n="characterdb.archiveStats"></span>
                </button>
                <button class="chardb-tab-btn" onclick="window.switchCharDbTab('potentials')">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span data-i18n="characterdb.potentials"></span>
                </button>
                <button class="chardb-tab-btn" onclick="window.switchCharDbTab('skills')">
                    <i class="fa-solid fa-bolt"></i>
                    <span data-i18n="characterdb.skills"></span>
                </button>
                <button class="chardb-tab-btn" onclick="window.switchCharDbTab('talents')">
                    <i class="fa-solid fa-sitemap"></i>
                    <span data-i18n="characterdb.talents"></span>
                </button>
                <button class="chardb-tab-btn" onclick="window.switchCharDbTab('voicelines')">
                    <i class="fa-solid fa-music"></i>
                    <span data-i18n="characterdb.voicelines.title"></span>
                </button>
            </div>

            <!-- Tab Content -->
            <div class="chardb-tab-content">
                <div id="tab-images" class="chardb-tab-panel active">
                    <div id="char-image-gallery" class="char-image-gallery"></div>
                </div>

                <div id="tab-archive-stats" class="chardb-tab-panel">
                    <div class="archive-stats-wrapper">
                        <div class="archive-section">
                            <div class="section-header">
                                <h2 class="section-title">
                                    <span class="section-icon"><i class="fa-solid fa-book-bookmark"></i></span>
                                    <span data-i18n="characterdb.archive"></span>
                                </h2>
                            </div>
                            <div id="archive-list" class="archive-list"></div>
                        </div>

                        <div class="stats-section">
                            <div class="section-header">
                                <h2 class="section-title">
                                    <span class="section-icon"><i class="fa-solid fa-chart-bar"></i></span>
                                    <span data-i18n="characterdb.stats"></span>
                                </h2>
                            </div>
                            <div class="level-control">
                                <label for="level-slider" class="level-label">
                                    <span data-i18n="common.level"></span>: <span id="current-level"
                                        class="level-display">1</span>
                                    <span id="limitbreak-badge" class="limitbreak-badge" style="display: none;"><span
                                            data-i18n="characterdb.limitbreak"></span> <span
                                            id="current-limitbreak">0</span></span>
                                </label>
                                <input type="range" id="level-slider" class="level-slider" min="1" max="98" value="1">
                            </div>
                            <div id="stats-grid" class="stats-grid"></div>
                        </div>
                    </div>
                </div>

                <div id="tab-potentials" class="chardb-tab-panel">
                    <div class="character-potentials-section" id="character-potentials-section">
                        <div class="potential-controls">
                            <div class="potential-type-toggle">
                                <button class="potential-type-btn active" data-type="main"
                                    onclick="window.switchPotentialType('main', event)">
                                    <i class="fa-solid fa-star"></i> <span
                                        data-i18n="characterdb.potentialType.main"></span>
                                </button>
                                <button class="potential-type-btn" data-type="assist"
                                    onclick="window.switchPotentialType('assist', event)">
                                    <i class="fa-solid fa-hands-helping"></i> <span
                                        data-i18n="characterdb.potentialType.assist"></span>
                                </button>
                            </div>
                            <div class="potential-level-control">
                                <label for="potential-level-slider" class="potential-level-label">
                                    <span data-i18n="characterdb.levelControl"></span>: <span
                                        id="potential-level-display" class="potential-level-display">1</span>
                                    <span class="potential-level-note" data-i18n="characterdb.levelNote"></span>
                                </label>
                                <div class="potential-level-slider-wrapper">
                                    <button class="potential-level-btn"
                                        onclick="window.adjustPotentialLevel(-1)">−</button>
                                    <input type="range" id="potential-level-slider" class="potential-level-slider"
                                        min="1" max="9" value="1"
                                        oninput="window.updatePotentialLevel(parseInt(this.value))">
                                    <button class="potential-level-btn"
                                        onclick="window.adjustPotentialLevel(1)">+</button>
                                </div>
                            </div>
                        </div>
                        <div id="potentials-display" class="potentials-display"></div>
                    </div>
                </div>

                <div id="tab-skills" class="chardb-tab-panel">
                    <div class="character-skills-section">
                        <div class="skill-level-control">
                            <label for="skill-level-slider" class="skill-level-label">
                                <span data-i18n="characterdb.skillLevel"></span>: <span id="skill-level-display"
                                    class="skill-level-display">1</span>
                            </label>
                            <div class="skill-level-slider-wrapper">
                                <button class="skill-level-btn" onclick="window.adjustSkillLevel(-1)">−</button>
                                <input type="range" id="skill-level-slider" class="skill-level-slider" min="1" max="13"
                                    value="1" oninput="window.updateSkillLevel(parseInt(this.value))">
                                <button class="skill-level-btn" onclick="window.adjustSkillLevel(1)">+</button>
                            </div>
                        </div>
                        <div id="skills-display" class="skills-display"></div>
                    </div>
                </div>

                <div id="tab-talents" class="chardb-tab-panel">
                    <div class="character-talents-section">
                        <div id="talents-display" class="talents-display"></div>
                    </div>
                </div>

                <div id="tab-voicelines" class="chardb-tab-panel">
                    <div class="character-voicelines-section">
                        <div id="voicelines-display" class="voicelines-display"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swUrl = new URL('sw.js', window.location.href).pathname;
                navigator.serviceWorker.register(swUrl)
                    .then(reg => console.log('[SW] Registered:', reg.scope))
                    .catch(err => console.warn('[SW] Registration failed:', err));
            });
        }
    </script>

    <script type="module" src="src/pages/characterdb.ts"></script>
</body>

</html>
