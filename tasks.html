<!DOCTYPE html>
<html lang="ko" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Theme Initialization -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <!-- Hide i18n elements until translations load - optimized to prevent CLS -->
    <style>
        html.i18n-loading [data-i18n],
        html.i18n-loading [data-i18n-placeholder],
        html.i18n-loading [data-i18n-title] {
            visibility: hidden;
            min-height: 1.5em; /* Reserve space to prevent layout shift */
        }

        html:not(.i18n-loading) [data-i18n],
        html:not(.i18n-loading) [data-i18n-placeholder],
        html:not(.i18n-loading) [data-i18n-title] {
            visibility: visible;
            transition: opacity 0.15s ease-in;
        }
    </style>
    <script>document.documentElement.classList.add('i18n-loading');</script>

    <title>의뢰 도우미</title>
    <link rel="icon" type="image/png" href="assets/others/favicon.png">

    <!-- DNS Prefetch & Preconnect - Performance optimized -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://static.cloudflareinsights.com">

    <!-- Font Awesome 7 Icons - Optimized loading -->
    <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous" referrerpolicy="no-referrer">
    </noscript>

    <link rel="stylesheet" href="css/utils.css">
    <link rel="stylesheet" href="css/components/ui-components.css">
    <link rel="stylesheet" href="css/tasks.css">

    <script defer src='https://static.cloudflareinsights.com/beacon.min.js'
        data-cf-beacon='{"token": "2db4a0ab2bf144419ec4ed1c864c934d"}'></script>
</head>

<body>
    <!-- Navigation Bar (Dynamic) -->
    <div id="global-navigation"></div>

    <div class="tasks-app">
        <!-- Page Header with Stats -->
        <header class="page-header">
            <div class="header-title">
                <div class="header-title-row">
                    <h1><img src="assets/others/btn_main_system_task.png" alt="Tasks Icon" class="page-title-icon"> <span data-i18n="tasks.title">의뢰 도우미</span></h1>
                    <button class="page-info-btn" data-action="open-info-modal" title="페이지 도움말">
                        <i class="fa-solid fa-circle-question"></i>
                    </button>
                </div>
                <p class="subtitle" data-i18n="tasks.subtitle">최대 4개의 의뢰를 선택하고 캐릭터로 태그를 채워보세요</p>
            </div>
            <div class="header-stats">
                <div class="stat-badge">
                    <i class="fa-solid fa-heart"></i>
                    <span id="header-owned-count"><span data-i18n="tasks.owned">보유</span>: 0/0</span>
                </div>
                <div class="stat-badge">
                    <i class="fa-solid fa-check-circle"></i>
                    <span id="header-completion"><span data-i18n="tasks.completion">완료</span>: 0/4</span>
                </div>
                <button class="control-btn manage-ownership-btn" id="manage-ownership-btn">
                    <i class="fa-solid fa-heart"></i> <span data-i18n="tasks.manageOwnership">보유 여행가 관리</span>
                </button>
            </div>
        </header>

        <!-- Page Info Modal -->
        <div id="page-info-modal" class="info-modal">
            <div class="info-modal-content">
                <div class="info-modal-header">
                    <h2><i class="fa-solid fa-circle-question"></i> <span data-i18n="common.howToUse">사용 방법</span></h2>
                    <button class="info-modal-close" data-action="close-info-modal">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="info-modal-body" data-i18n-html="tasks.instructions">
                </div>
            </div>
        </div>

        <!-- Main Layout: Sidebar + Content -->
        <div class="tasks-layout">
            <!-- Left Sidebar: Task Pool -->
            <aside class="task-pool">
                <div class="task-pool-header">
                    <h2><i class="fa-solid fa-clipboard-list"></i> <span data-i18n="tasks.taskList">의뢰 목록</span></h2>
                    <span class="task-pool-count" id="task-pool-count">70</span>
                </div>
                <div class="task-pool-search">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="task-search" data-i18n-placeholder="tasks.searchPlaceholder"
                        placeholder="의뢰 검색...">
                </div>
                <div class="task-pool-list" id="tasks-list"></div>
            </aside>

            <!-- Right Content: Assignments + Characters -->
            <main class="tasks-content">
                <!-- Active Assignments Section -->
                <section class="assignments-section">
                    <div class="assignments-header">
                        <h2>
                            <i class="fa-solid fa-check"></i> <span data-i18n="tasks.selectedTasks">선택된 의뢰</span>
                            <span class="task-counter" id="task-counter">0/4</span>
                        </h2>
                        <div class="assignments-actions">
                            <button class="action-btn auto-fill-btn" id="auto-fill-btn" style="display:none;">
                                <i class="fa-solid fa-wand-magic-sparkles"></i> <span data-i18n="tasks.autoAssign">자동
                                    배정</span>
                            </button>
                            <button class="action-btn clear-btn" id="clear-all-btn" style="display:none;">
                                <i class="fa-solid fa-user-xmark"></i> <span data-i18n="tasks.resetCharacters">캐릭터
                                    초기화</span>
                            </button>
                        </div>
                    </div>
                    <div id="selected-tasks" class="assignments-grid"></div>
                </section>

                <!-- Recommendations Section -->
                <section class="recommendations-section" id="recommendations-section" style="display:none;">
                    <div class="recommendations-header">
                        <h3><i class="fa-solid fa-lightbulb"></i> <span data-i18n="tasks.recommendations">획득/육성 추천 (앞에
                                올수록 추천)</span></h3>
                    </div>
                    <div id="recommendations-content" class="recommendations-content"></div>
                </section>

                <!-- Character Pool Section -->
                <section class="character-pool-section">
                    <div class="character-pool-header">
                        <h2><i class="fa-solid fa-users"></i> <span data-i18n="tasks.characterPool">여행가 풀</span></h2>
                        <div class="character-pool-controls">
                            <div class="filter-buttons">
                                <button class="filter-btn active" data-filter="all"
                                    data-i18n="tasks.filterAll">전체</button>
                                <button class="filter-btn" data-filter="owned" data-i18n="tasks.filterOwned">보유</button>
                                <button class="filter-btn" data-filter="not-owned"
                                    data-i18n="tasks.filterNotOwned">미보유</button>
                            </div>
                        </div>
                    </div>
                    <div id="characters-list" class="character-pool-grid"></div>
                </section>
            </main>
        </div>

        <!-- Ownership Modal -->
        <div class="modal ownership-modal" id="ownership-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2><i class="fa-solid fa-heart"></i> <span data-i18n="tasks.ownershipManagement">여행가 보유 관리</span>
                    </h2>
                    <button class="close-btn" id="close-ownership-modal">&times;</button>
                </div>
                <div class="modal-controls">
                    <button class="control-btn" id="select-all-owned">
                        <i class="fa-solid fa-check-double"></i> <span data-i18n="tasks.selectAll">전체 선택</span>
                    </button>
                    <button class="control-btn" id="deselect-all-owned">
                        <i class="fa-solid fa-xmark"></i> <span data-i18n="tasks.deselectAll">전체 해제</span>
                    </button>
                    <div class="ownership-count" id="ownership-count"><span data-i18n="tasks.owned">보유</span>: 0 / 0
                    </div>
                </div>
                <div class="ownership-grid" id="ownership-grid"></div>
            </div>
        </div>

        <!-- Confirmation Modal -->
        <div class="modal confirm-modal" id="confirm-modal" style="display:none;">
            <div class="confirm-modal-content">
                <div class="confirm-modal-icon">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h3 class="confirm-modal-title" id="confirm-modal-title" data-i18n="tasks.confirm">확인</h3>
                <p class="confirm-modal-message" id="confirm-modal-message" data-i18n="tasks.confirmMessage">작업을
                    진행하시겠습니까?</p>
                <div class="confirm-modal-actions">
                    <button class="confirm-modal-btn cancel-btn" id="confirm-modal-cancel"
                        data-i18n="tasks.cancel">취소</button>
                    <button class="confirm-modal-btn confirm-btn" id="confirm-modal-confirm"
                        data-i18n="tasks.confirm">확인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swUrl = new URL('sw.js', window.location.href).pathname;
                navigator.serviceWorker.register(swUrl)
                    .then(reg => console.log('[SW] Registered:', reg.scope))
                    .catch(err => console.warn('[SW] Registration failed:', err));
            });
        }
    </script>

    <script type="module" src="src/pages/tasks.ts"></script>
</body>

</html>
