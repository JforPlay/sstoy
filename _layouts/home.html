<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page Title -->
    <title>{{ page.title | default: site.title }}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ '/assets/others/favicon.png' | relative_url }}">

    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Common Utilities -->
    <link rel="stylesheet" href="{{ '/css/utils.css' | relative_url }}">

    <!-- Page-Specific CSS -->
    {% if page.css %}
        {% for stylesheet in page.css %}
    <link rel="stylesheet" href="{{ stylesheet | relative_url }}">
        {% endfor %}
    {% endif %}

    <!-- Cloudflare Web Analytics -->
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "2db4a0ab2bf144419ec4ed1c864c934d"}'></script>

    <!-- Core Scripts -->
    <script src="{{ '/js/utils.js' | relative_url }}"></script>
    <script src="{{ '/js/i18n.js' | relative_url }}"></script>

    <!-- Page-Specific Head Scripts -->
    {% if page.scripts_head %}
        {% for script in page.scripts_head %}
    <script src="{{ script | relative_url }}"></script>
        {% endfor %}
    {% endif %}
</head>

<body>
    <!-- Home page has custom header controls (no navbar) -->
    <div class="background-image"></div>

    <!-- Controls Header -->
    <div class="page-controls">
        <select id="language-select" class="language-select" onchange="window.i18n.setLanguage(this.value)">
            <option value="KR">🇰🇷 한국어</option>
            <option value="JP">🇯🇵 日本語</option>
            <option value="EN">🇺🇸 English</option>
            <option value="CN">🇨🇳 中文</option>
        </select>
        <button id="theme-toggle" class="theme-toggle" onclick="window.toggleTheme()">
            <span class="theme-icon"></span>
        </button>
    </div>

    <!-- Main Content -->
    {{ content }}

    <!-- Page-Specific Footer Scripts -->
    {% if page.scripts_footer %}
        {% for script in page.scripts_footer %}
    <script src="{{ script | relative_url }}"></script>
        {% endfor %}
    {% endif %}
</body>
</html>
